            ul li{

                color: blue;
                width: 100px;
                height: 40px;
                border: 3px solid black;
                margin: 10px;
                text-align: center;
                line-height: 40px;
            }



        </style>
    </head>

        <nav>
            <ul>

                <li>메뉴2</li>
                <li>메뉴3</li>
                <li>메뉴4</li>
            </ul>
        </nav>
        



    </body>

</html>
