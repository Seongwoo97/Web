<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nanum4</title>

    <style>


        .wrap{
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="wrap">

    <h1>4의 배수일까 아닐까</h1>

    <script>
        let num = prompt('숫자를 입력하시오');

        if(num === null){
            alert("취소되었습니다.");
        }else{
            document.write(`<div class="text">`)
            if(parseInt(num) % 4 === 0){
                document.write(`${num}는/은 4의 배수입니다.`);
            }else{
                document.write(`${num}는/은 4의 배수가 아닙니다.`)
            }document.write(`</div>`)
        }


    </script>

    </div>


    
</body>
</html>
