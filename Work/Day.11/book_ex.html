<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>read time</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container{
            width: 300px;
            height: 300px;
            border: 1px solid #222;
            background-color: rgb(127, 172, 255);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        h1{
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
        }

        p{
            margin-top: 0;
            margin-left: auto;
            margin-right: auto;
        }

        .accent{
            font-size: 1.8em;
            font-weight: bold;
            color: red;
        }

    </style>


</head>
<body>

    <div id="container">
        <h1>책 읽기</h1>
        <p><span class="accent" id="result"></span>일 연속으로<br>책 읽기를 달성했군요.</p>

        <p>축하합니다!</p>



    </div>

     <script>
        let now = new Date();
        let firstDay = new Date("2026-06-01");

        let toNow= now.getTime();
        let toFirst = firstDay.getTime();
        let passedTime = toNow - toFirst;

        passedTime = Math.round(passedTime/(1000*60*60*24));

        document.querySelector('#result').innerText = passedTime;


    </script>
    
</body>
</html>
