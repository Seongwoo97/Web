<!-- 무료 아이콘 이미지 제공 사이트 : flaticon -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼쩜삼 ui 만들어보기</title>

    <!-- 외부 스타일시트 -->
    <link rel="stylesheet" href="./mobileUI.css">


    </style>
</head>
<body>
    <div id="container">

        <div id="toolbar">
            <img class="toolbar-img" src="./source/back_arrow.png" alt="뒤로가기">
            <button class="toolbar-btn">문의하기</button>

        </div>

        <h2>
            <span class="blue">2026년 기준으로</span> 본인이 해당하는 <br>
            조건이 있다면 모두 골라주세요
        </h2>

        <div class="option-container">
            <!-- 띄어쓰기를 통해 여러개의 클래스명 지정 가능!! -->
            <div class="option selected">
                <img src="./source/ring.png" alt="반지">
                <p>배우자가 있어요</p>
            </div>

            <div class="option">
                <img src="./source/ring.png" alt="반지">
                <p>주민등록상 <br>
                세대주에요</p>
            </div>

            <div class="option">
                <img src="./source/ring.png" alt="반지">
                <p>장애인이에요</p>
            </div>

            <div class="option">
                <img src="./source/ring.png" alt="반지">
                <p>가족 중에 <br>
                장애인이 있어요
                </p>
            </div>

            <div class="option">
                <img src="./source/ring.png" alt="반지">
                <p>위탁 아동이 <br>
                있어요</p>
            </div>

        </div>

        <button class="next-btn">다음</button>





    </div>
    
    
</body>
</html>
