<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대학언론사 수습기사 모집</title>
    <style>
        h1{
            text-align: center;
            margin: 0;
        }

        h3{text-align: center; font-style: italic;}

        ul{
            list-style: none;
        }

        .point {
            color: orangered;
            font-weight: bold;
        }

        .below{
            color: black;
            font-weight: 300;
        }
        
        .title{
            display: block;
            background-color: rgb(0, 53, 0);
            color: white;
            padding: 15px;
        }

        body{
            background-color: black;
            margin: 0;
        }

        .wrap{
            background-color: white;
            min-height: 800px;
            background-image: url(./source/mike_in_hand.png);
            background-repeat: no-repeat;
            background-position: bottom right;
            padding: 30px 5% 5% 5%;
            margin: 0 5% 5% 5%;
        }

    </style>
</head>
<body>

    <div class="wrap">
    <h1 class="title">대학언론사 수습기자 모집</h1>

    <h3>신입생 여러분을 기다립니다</h3>

    <ul>
        <li class="point">모집분야 
            
            <ul class="below">
                <br>
                <li>아나운서(0명): 학내 소식을 라디오 방송으로 보도</li>
                <li>오프닝쇼프로듀서(0명): 라디오 방송 기획, 제작</li>
                <li>엔지니어(0명):라디오 방송 녹음 및 편집</li>
            </ul>
        </li>
        <br>
        <li class="point">혜택
            
            <ul class="below">
                <br>
                <li>수습기자 활동 중 소정의 활동비 지급</li>
                <li>정기자로 진급하면 장학금 지급</li>
            </ul>

        </li>
    </ul>
    </div>

</body>
</html>
