<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
    <style>
        .wrap{
            width: 500px;
            height: 500px;
            border: 1px dotted red;
            margin-right: auto;
            margin-left: auto;
            position: relative;
        }

        h1{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

    </style>
</head>

    <div class="wrap">
        <h1>Hello!</h1>


    </div>
    
</body>
