<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Map</title>

    <!-- 실제 지도를 불러오는 작업을 수행하는 카카오의 지도 api 라이브러리 적용(외부 스크립트) : 발급받은 자바스크립트 키를 등록 -->
     <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8ca0785f755a41e7a594e16fbc7654f9"></script>

     <!-- 지도를 띄우는 코드 작성(외부 스크립트) defer:지연 -->
    <script src="./map.js" defer></script>

</head>
<body>

    <button onclick="aaa()" style="font-size: 18px; padding: 5px 8px;">my location</button>
    <h3 id="hh">위도(latitude), 경도(longitude)</h3>
    <hr>
    <div id="map" style="width: 100%; height: 600px; display: none;"></div>
    <hr>
    <button onclick="bbb()" style="font-size: 15px;">위치 자동 업데이트</button>
    <button onclick="ccc()" style="font-size: 15px;">자동 업데이트 종료</button>

    <script>
        function aaa(){
            // 현재 내 위치정보를 얻어오는 시간이 걸리기에..
            // 내 위치 탐색이 완료되면 실행될 콜백함수를 파라미터로 등록
            window.navigator.geolocation.getCurrentPosition( function(position){
                // 파라미터로 전달된 position 안에 위도, 경도 정보가 있음
                var lat= position.coords.latitude;
                var lng= position.coords.longitude;

                document.getElementById('hh').innerHTML= lat + " ," + lng;
                moveToMyLocation(lat, lng);
            }, function(error){
                alert(error.code + '\n' + error.message);
            })
        }

        var id;
        function bbb(){
            id= navigator.geolocation.watchPosition(function(position){
            var lat= position.coords.latitude;
            var lng= position.coords.longitude;
            document.getElementById('hh').innerHTML= lat + '<br>' + lng;
            moveToMyLocation(lat, lng);
            })
        }

        function ccc(){
            navigator.geolocation.clearWatch(id);
        }

    </script>

    
</body>
</html>
