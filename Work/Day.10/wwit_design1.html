<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>naver pay</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            text-align: center;
            list-style-type: none;
        }

        #container{
            width: 40%;
            height: 100vh;
            margin-left: auto;
            margin-right: auto;
            /* background-color: aquamarine; */
        }

        header{
            display: flex;
        }

        header img{
            justify-items: flex-start;
            padding: 5px;
        }

        .agree-box{
            border: 1px solid #d6dce5;
            /* width: 500px;
            margin-left: auto;
            margin-right: auto; */
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 16px;
            text-align: left;
        }

        .agree-title{
            height: 56px;
            padding: 0px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d6dce5;
        }

        .agree-title label{
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .agree-title strong{
            color: #00c773;
        }

        .agree-list{
            list-style: none;
            margin: 0;
            padding: 10px 16px 14px;
        }

        .agree-list li{
            height: 34px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            padding-left: 20px;
        }

        .agree-list label{
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .agree-list button{
            border: none;
            background: none;
            color: #9aa1ad;
            font-size: 12px;
        }

        .agree-list button:hover{
            color: black;
        }

        #input_yours{
            border: 1px solid #d6dce5 ;
            border-radius: 8px;
            /* padding: 20px; */
            overflow: hidden;
            text-align: left;
            display: flex;
            flex-wrap: wrap;
            flex-direction: column;
            justify-content: space-between;
            margin: 20px 16px;
        }

        #name_board{
            border-bottom: 1px solid #d6dce5 ;
            height: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0px 10px;
            box-sizing: border-box;
            
        }

        #input_yours img{
            width: 23px;
            height: 22px;
            padding: 0px;
            opacity: 50%;
        }

        #name_board input{
            border: none;
            flex: 1;
            height: 100%;
            font-size: 15px;
            box-sizing: border-box;
        }

        #birth_board{
            border-bottom: 1px solid #d6dce5 ;
            height: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0px 10px;
            box-sizing: border-box;
        
        }

        #birth{
            border: none;
            flex: none;
            width:120px;
            height: 100%;
            font-size: 15px;
            box-sizing: border-box;
        }


        #telecom_board{
            border-bottom: 1px solid #d6dce5 ;
            height: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0px 10px;
            box-sizing: border-box;
        }

        #telecom_board > span{
            font-size: 15px;
            color: #6d7277;
        }

        .radio-btn{
            margin: 0;
            padding: 0;
        }

        .radio-btn input{
            display: none;
        }

        .radio-group{
            display: flex;
            margin-left: auto;
        }

        .radio-btn span{
            display: flex;
            justify-content: center;
            align-items: center;

            width: 50px;
            height: 30px;

            border: 1px solid #d6dce5;
            background: white;
            color: #666;
            font-size: 12px;
            cursor: pointer;

            white-space: nowrap;
        }

        .radio-btn:first-of-type span{
            border-radius: 4px 0 0 4px;
        }

        .radio-btn:last-of-type span{
            border-radius: 0 4px 4px 0;
            border-left: none;
        }

        .radio-btn input:checked + span{
            background-color: #f3f5f7;
            color: #222;
            font-weight: bold;
        }


        #phone_num_board{
            height: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 10px;
            padding-right: 0;
            box-sizing: border-box;
        }

        #phone_num_board input{
            border: none;
            flex: 1;
            height: 100%;
            font-size: 15px;
            box-sizing: border-box;
        }

        #phone_num_board button{
            border: none;
            height: 100%;
            width: 70px;
            padding: 0;
            margin: 0;

            background-color: #6d7277;
            color: white;
            border-radius: 0;
        }

        #phone_num_board button:hover{
            background-color: #414447;
            cursor: pointer;
        }
    

    </style>

</head>
<body>

    <div id="container">

        <header>
            <img src="./image/logo.png" alt="logo">



        </header>

        <main>
            <div id="text_main">
                <h3>본인확인을 위한<br>휴대전화 인증이 필요합니다</h3>
            </div>

        <div class="agree-box">
            <div class="agree-title">
                <label>
                    <input type="checkbox">
                    <strong>(필수) 약관 전체동의</strong>
                </label>
                <span>⌃</span>
            </div>

            <ul class="agree-list">
                <li>
                    <label><input type="checkbox"> 인증시 개인정보 이용</label>
                    <button onclick="enter()">전체 ></button>
                </li>
                <li>
                    <label><input type="checkbox"> 인증시 고유식별정보 처리</label>
                    <button onclick="enter()">전체 ></button>
                </li>
                <li>
                    <label><input type="checkbox"> 통신사 이용약관</label>
                    <button onclick="enter()">전체 ></button>
                </li>
                <li>
                    <label><input type="checkbox"> 인증사 이용약관</label>
                    <button onclick="enter()">전체 ></button>
                </li>
                <li>
                    <label><input type="checkbox"> 네이버파이낸셜 개인정보 수집</label>
                    <button onclick="enter()">전체 ></button>
                </li>
            </ul>
        </div>

        <script>
            function enter(){
                window.open('', '', 'width= 500, height= 500')
            }

        </script>


        </main>

        <div id="input_yours">

            <div id="name_board">
                <img src="./image/user-avatar.png" alt="user_avatar">
                <input type="text" placeholder="이름">
            </div>

            <div id="birth_board">
                <img src="./image/calendar.png" alt="calender">
                <input id="birth" type="number" placeholder="생년월일 8자리">
                <div class="radio-group">
                    <label class="radio-btn">
                        <input type="radio" name="gender">
                        <span>남자</span>
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="gender">
                        <span>여자</span>
                    </label>
                </div>
            </div>

            <div id="telecom_board">
                <img src="./image/signal-tower.png" alt="telecom">
                <span>통신사 선택</span>
                <select name="telecome" id="telecom">
                    <option value="skt">skt</option>
                    <option value="kt">kt</option>
                    <option value="U+">U+</option>
                </select>
                <div class="radio-group">
                    <label class="radio-btn"><input type="radio" name="nationality">
                        <span>내국인</span>
                    </label>

                    <label class="radio-btn"><input type="radio" name="nationality">
                        <span>외국인</span>
                    </label>
                </div>
            </div>

            <div id="phone_num_board">
                <img src="./image/smartphone.png" alt="phone">
                <input type="number" placeholder="전화번호">
                <button onclick="next()">확인</button>
            </div>

            <script>
                function next(){
                    window.open('','','width= 500px , height=500px')
                }
            </script>


        </div>










    </div>

    
</body>
</html>
