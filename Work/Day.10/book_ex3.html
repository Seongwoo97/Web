<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 비교</title>

    <script>
        function numComp(x, y){
            if(x>y){
                alert(`${x}(이)가 ${y}보다 큽니다.`);
            }else if(y>x){
                 alert(`${y}(이)가 ${x}보다 큽니다.`);
            }else{
                alert("두 수가 같습니다.");
            }
        }

        let num1 = parseInt(prompt("비교할 첫 번째 숫자"));
        let num2 = parseInt(prompt("비교할 두 번째 숫자"));

        numComp(num1, num2);



    </script>
</head>

</body>
</html>
