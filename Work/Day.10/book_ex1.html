<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>count</title>

    <script>
        function calcSum(n){
            let sum = 0;

            for (let i=0; i <= n; i++){
                sum += i;
            }
            document.write(`1부터 ${n}까지 더하면 ${sum}`);
        }

        let userNumber = prompt("얼마까지 더해볼까요?");
        if (userNumber !== null){
            calcSum(parseInt(userNumber));
        }



    </script>

</head>
<body>
    
</body>
</html>
