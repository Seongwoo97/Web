<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>전환 효과</title>

        <style>
            div{
                width: 100px; 
                height: 50px; 
                border: 1px solid black;
                background-color: yellow;

                /* width 속성값이 바뀔 때 전환 효과를 주자 */
                transition: width 1s; height: 1s;
            }

            div:hover{
                width: 200px;
                height: 100px;
            }


        </style>
    </head>
    <body>
       
        <div>마우스를 올려보세요</div>

    </body>
</html>
