<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>layout css propertiy</title>
        <style>
            /* display 속성 실습 */
            #aa{display: inline; width: 300px;}
            #aa{display: inline-block;}

            img{display: block;}

            #kk{display: none;} /* display: hidden 은 지금 작동 안 함. 대신 visibility: hidden 으로 들어가면 자리는 차지하되 보이지 않게 됨 */

        </style>
    </head>
    <body>
        
        <!-- display 속성 연습 -->
        <p id="aa">Hello world!</p>
        <a href="">Good day</a>
        <strong>good morning</strong>

        <img src="./image/border.png" alt="이미지">

        <hr>

        <ul>
            <li>aaa</li>
            <li id="kk">bbb</li>
            <li>ccc</li>
        </ul>

        <hr>

        <!-- block 요소와 inline 요소를 혼합하여 사용할 때 고려할 것들 -->

        <!-- block 요소 안에 inline 요소를 넣을 수 있음 -->

        <div style="background-color: tomato; border: solid; padding: 5px;">
            Nice <em>aaaa</em> world
        </div>

        <!-- inline 요소 안에 block 요소를 넣으면 안됨. 에러는 아닌데 좀 이상해짐 -->
        <span style="background-color: teal; border: solid; padding: 5px;">
            Nice <p>aaaaa</p> world
        </span>

        <!-- block 안에 다른 block 요소를 넣을 수 있음 -->

        <div style="background-color: azure; border: solid; padding: 5px;">
            Nice <p>aaaaaaaa</p> world
        </div>

        <!-- blcok 안에 같은 block 요소를 넣으면..? 이는 조심할 것 -->
        <p style="background-color: aqua; border: solid; padding: 5px;">
            Nice <p>aaaaa</p> world
        </p>

        <!-- blcok 안에 같은 block 요소를 넣으면..? 이는 조심할 것 -->
        <h2 style="background-color: aqua; border: solid; padding: 5px;">
            Nice <h2>aaaaa</h2> world
        </h2>


        <!-- div block 요소 안에 div block 요소가 존재하는 것은 허용 -->
        <div style="background-color: bisque; border: solid; padding: 5px;">
            Nice <div>aaaaa</div> world
        </div>

        <hr>

        <!-- position 속성 & 위치 지정 속성(left, right, top, bottom) -->
        <div class="region">
            <p id="p1">block #1</p>
            <p id="p2">block #2</p>
            <p id="p3">block #3</p>
        </div>

        <style>

            .region{
                background-color: black; 
                position: relative;
            }


            #p1{
                background-color: aqua;
                width: 200px;
                height: 50px;
            }

            #p2{
                position: static;    /* 정적위치- default : 원래 놓여져야 할 위치에 놓여짐(겹치지 않음) */
                position: relative;  /* 상대위치- 원래 놓여질 위치에서 위치지정 속성값을 반영함 */
                position: absolute;  /* 절대위치- 웹문서의 좌상단을 기준으로 배치 (위치 지정 속성이 없으면 그려지지 않음) */
                /* 절대위치 사용 시 부모 요소의 포지션이 static 이 아니면.. 부모 요소의 좌상단을 기준으로 한다 */
                position: fixed;     /* 고정위치- 웹 브라우저창을 기준으로 배치. 스크롤해도 고정된 채로 떠다님 */

                /* 위치 지정 속성(pistion:static 에서는 무시됨) */
                /* legt: 50px;
                top: 30px; */
                right: 10px;
                bottom: 20px;

                background-color: yellow;
                width: 150px;
                height: 50px;
            }

            #p3{
                background-color: lightgreen;
                width: 200px;
                height: 50px;
            }
        </style>

    </body>

</html>
