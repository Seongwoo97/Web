<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex_shrink</title>

    <style>
        #container{
            display: flex;
        }
        #container>div{
            background-color: dodgerblue;
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
        }
    </style>

</head>


<body>

    <div id="container">
        <div> 1 </div>
        <div> 2 </div>
        <div style="flex-shrink: 0;"> 3 </div>
        <!-- N배 더 빠르게 길이가 감소된다 -->
        <div> 4 </div>
        <div> 5 </div>
        <div style="flex-shrink: 2;"> 6 </div>
        <div> 7 </div>
        <div> 8 </div>
        <div> 9 </div>

    </div>
    
</body>
</html>
