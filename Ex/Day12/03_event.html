<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Event Handling</title>
    
    <!-- 내부 스크립트 -->
     <script>
        // body 안에 있는 h2 요소에 글씨를 추가하기 -- 실행 불가. 
        var h2= document.getElementById('aa');
        h2.innerHTML= 'Hello';
        // why? body 영역이 만들기 전에, head가 먼저 실행되기에 아직 h2 요소가 없는 상태임.
        
        // 위 동작이 되려면.. body 영역의 요소들이 모두 만들어진 후 수행해야 함.
        // 그래서 body 요소에 문서 로딩이 완료되었을 때 발생하는 'load 이벤트'를 처리하기!
        function loaded(){
            var h2= document.getElementById('aa');
            h2.innerHTML= 'Hello';
        }

     </script>

     <!-- 실무에서는 외부 스크립트를 더 선호하면.. 외부 스크립트를 사용한다면 defer 속성으로 onload 이벤트 처리를 대신할 수 있음. defer : 연기/지연하다 -->
     <script src="./aa.js" defer></script>

     <!-- defer 속성은 외부 스크립트만 가능함. 내부 스크립트에서는 적용 안 됨. -->

</head>
<body onload="loaded()">

    <h2 id="aa"></h2>
    <h3 id="bb">nice to meet you</h3>

    <hr>

    <!-- 이벤트 처리 함수를 등록하는 또 다른 방법 (JS로 요소를 찾아서 이벤트 처리) -->
     <button id="btn">click me</button>
    
    <!-- 또 다른 이벤트 등록 방법 -->
     <button class="kk">버튼</button>

</body>
</html>
